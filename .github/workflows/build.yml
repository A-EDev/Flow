name: Android CI/CD

on:
  push:
    branches: [ main, master, develop, agent/discord-rich-presence ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Kotlin formatting
        run: >
          ./gradlew spotlessCheck
          --build-cache --stacktrace

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            echo "Release keystore secret is not available. Skipping decoding."
          fi

      - name: Run unit tests
        run: >
          ./gradlew :app:testGithubDebugUnitTest :app:testFossDebugUnitTest
          --parallel --build-cache --stacktrace

      - name: Lint GitHub nightly
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:lintGithubNightly
          --build-cache --stacktrace

      - name: Lint GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:lintGithubRelease
          --build-cache --stacktrace

      - name: Build CI APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:assembleGithubRelease :app:assembleGithubNightly :app:assembleFossRelease
          --parallel --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APKs
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:assembleGithubRelease :app:assembleFossRelease
          --parallel --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Checksum nightly APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          test -f app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk
          sha256sum app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk | tee app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk.sha256

      - name: Report individual APK sizes
        shell: bash
        run: |
          shopt -s nullglob
          apks=(
            app/build/outputs/apk/github/release/app-github-arm64-v8a-release*.apk
            app/build/outputs/apk/github/release/app-github-armeabi-v7a-release*.apk
            app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release*.apk
            app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release*.apk
          )
          expected=4

          if (( ${#apks[@]} != expected )); then
            printf 'Expected %d published APKs, found %d.\n' "$expected" "${#apks[@]}" >&2
            exit 1
          fi

          {
            echo '## Individual APK sizes'
            echo
            echo '| APK | Size | Exact bytes |'
            echo '|---|---:|---:|'
            for apk in "${apks[@]}"; do
              bytes=$(stat --format='%s' "$apk")
              size=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f MiB", bytes / 1048576 }')
              printf '| `%s` | %s | %s |\n' "$(basename "$apk")" "$size" "$bytes"
            done
            echo
            echo '> GitHub and FOSS APKs are uploaded individually without compression. Nightly remains a compressed artifact on regular CI runs.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: flow-github-arm64-release-apk
          path: app/build/outputs/apk/github/release/app-github-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload GitHub ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: flow-github-armeabi-v7a-release-apk
          path: app/build/outputs/apk/github/release/app-github-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Nightly APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: flow-nightly-apk
          path: |
            app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk
            app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload FOSS ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: flow-foss-arm64-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload FOSS ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: flow-foss-armeabi-v7a-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          pattern: flow-*-release-apk
          path: dist/
          merge-multiple: true

      - name: Rename APKs for release
        run: |
          mv dist/app-github-arm64-v8a-release.apk dist/flow-arm64-v8a.apk
          mv dist/app-github-armeabi-v7a-release.apk dist/flow-armeabi-v7a.apk
          mv dist/app-foss-arm64-v8a-release.apk dist/flow-foss-arm64-v8a.apk
          mv dist/app-foss-armeabi-v7a-release.apk dist/flow-foss-armeabi-v7a.apk

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          test -s release-notes.md
          grep -Fqx "# Flow ${RELEASE_VERSION}" release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Flow ${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            dist/flow-arm64-v8a.apk
            dist/flow-armeabi-v7a.apk
            dist/flow-foss-arm64-v8a.apk
            dist/flow-foss-armeabi-v7a.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
