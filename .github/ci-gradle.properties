# Copied to ~/.gradle/gradle.properties on CI runners, where it overrides the project file.
# Replaces --max-workers=1 from #1011: the OOM came from 4 workers sharing one 4 GB Kotlin daemon.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.incremental=false
