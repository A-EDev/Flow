[scriptsmith_dataset]
subtitles_directory = "ml/sponsor_detection/data/external/scriptsmith_sponsorblock_2024/subtitles"
metadata_directory = "ml/sponsor_detection/data/external/scriptsmith_sponsorblock_2024/video_metadata"
mirror_path = "sb-mirror/sponsorTimes.csv"
provenance_path = "ml/sponsor_detection/reports/scriptsmith_dataset_provenance.json"
exclude_split_directories = [
    "ml/sponsor_detection/data/training/sponsor_windows_v1",
    "ml/sponsor_detection/data/training/sponsor_windows_v2",
    "ml/sponsor_detection/data/training/sponsor_windows_v3_replay",
]
output_directory = "ml/sponsor_detection/data/training/sponsor_windows_scriptsmith"
manifest_path = "ml/sponsor_detection/reports/sponsor_windows_scriptsmith_manifest.json"
encoder = "jhu-clsp/ettin-encoder-17m"
encoder_revision = "987607455c61e7a5bbc85f7758e0512ea6d0ae4c"
max_length = 1024
overlap_tokens = 128
seed = "flow-scriptsmith-v1"
train_fraction = 0.80
validation_fraction = 0.10
language_prefixes = ["en"]
positive_categories = ["sponsor"]
hard_negative_categories = ["selfpromo", "interaction"]
ordinary_negative_windows_per_video = 4
ordinary_negative_weight = 0.5
maximum_video_duration_seconds = 14400
minimum_cues = 10
maximum_videos = 0
