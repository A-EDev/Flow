[dataset]
manifest_path = "ml/sponsor_detection/reports/sponsor_windows_v3_replay_manifest.json"
train_path = "ml/sponsor_detection/data/training/sponsor_windows_v3_replay/train.parquet"
validation_path = "ml/sponsor_detection/data/training/sponsor_windows_v3_replay/validation.parquet"
test_path = "ml/sponsor_detection/data/training/sponsor_windows_v3_replay/test.parquet"

[model]
encoder = "jhu-clsp/ettin-encoder-17m"
revision = "987607455c61e7a5bbc85f7758e0512ea6d0ae4c"
initial_checkpoint = "ml/sponsor_detection/checkpoints/ettin_17m_sponsor_v1"
max_length = 1024
dropout = 0.10
labels = ["O", "B-SPONSOR", "I-SPONSOR", "L-SPONSOR", "U-SPONSOR"]

[validation]
tokenization_report_path = "ml/sponsor_detection/reports/ettin_17m_replay_tokenization.json"

[training]
output_directory = "ml/sponsor_detection/checkpoints/ettin_17m_sponsor_v3_replay"
seed = 20260830
epochs = 2
learning_rate = 0.000001
weight_decay = 0.01
warmup_steps = 50
train_batch_size = 8
eval_batch_size = 16
gradient_accumulation_steps = 4
bf16 = true
preprocessing_workers = 4
eval_steps = 250
eval_accumulation_steps = 16
save_steps = 250
logging_steps = 50
save_total_limit = 2
