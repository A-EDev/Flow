[benchmark_enrichment]
review_path = "ml/sponsor_detection/data/benchmarks/mixed_pilot_review_v1.jsonl"
review_manifest_path = "ml/sponsor_detection/reports/mixed_pilot_review_v1_manifest.json"
batch_size = 16
bf16 = true
max_length = 768
overlap_tokens = 128
merge_gap_characters = 24
merge_gap_ms = 1500
context_characters = 240

[[benchmark_enrichment.models]]
name = "v1_raw"
checkpoint_path = "ml/sponsor_detection/checkpoints/ettin_17m_sponsor_v1"
confidence_threshold = 0.0

[[benchmark_enrichment.models]]
name = "v3_replay_calibrated"
checkpoint_path = "ml/sponsor_detection/checkpoints/ettin_17m_sponsor_v3_replay"
decoder_config_path = "ml/sponsor_detection/reports/ettin_17m_replay_decoder.json"
