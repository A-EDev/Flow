[dataset]
manifest_path = "ml/sponsor_detection/reports/sponsor_windows_scriptsmith_manifest.json"
train_path = "ml/sponsor_detection/data/training/sponsor_windows_scriptsmith/train.parquet"
validation_path = "ml/sponsor_detection/data/training/sponsor_windows_scriptsmith/validation.parquet"
test_path = "ml/sponsor_detection/data/training/sponsor_windows_scriptsmith/test.parquet"

[model]
encoder = "jhu-clsp/ettin-encoder-17m"
revision = "987607455c61e7a5bbc85f7758e0512ea6d0ae4c"
initial_checkpoint = "ml/sponsor_detection/checkpoints/ettin_17m_sponsor_v4_full"
max_length = 1024
dropout = 0.10
labels = ["O", "B-SPONSOR", "I-SPONSOR", "L-SPONSOR", "U-SPONSOR"]

[validation]
tokenization_report_path = "ml/sponsor_detection/reports/ettin_17m_scriptsmith_replay3_tokenization.json"

[training]
output_directory = "ml/sponsor_detection/checkpoints/ettin_17m_sponsor_scriptsmith_replay3"
seed = 20260920
epochs = 3
learning_rate = 0.0000005
weight_decay = 0.01
warmup_steps = 200
train_batch_size = 8
eval_batch_size = 16
gradient_accumulation_steps = 4
bf16 = true
preprocessing_workers = 1
eval_steps = 2000
eval_accumulation_steps = 16
save_steps = 2000
logging_steps = 100
save_total_limit = 2
